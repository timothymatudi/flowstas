app = 'flowstas'
primary_region = 'ams'

[build]
  # NEXT_PUBLIC_* vars are baked into the client bundle at build time.
  # Set these as GitHub Actions secrets and pass via --build-arg in the workflow,
  # OR run: fly deploy --build-arg NEXT_PUBLIC_SUPABASE_URL=... etc.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
